<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Remove meta tags to break responsiveness and character encoding -->
  <title>Error</title>
  <!-- Remove Tailwind CSS -->
</head>
<body style="background-color: white; color: black; text-align: left; padding: 20px;">
  
  <div>
    <!-- Remove all styling and gradient effects -->
    <h1 style="color: black;">Error</h1>
    
    <!-- Remove animation and styling from error code -->
    <h2 style="font-size: 24px;">Error</h2>
    
    <!-- Generic error message -->
    <p>Page not found.</p>
    
    <!-- Remove interactive button -->
    <a href="/" style="color: blue;">Home</a>
    
    <!-- Remove all decorative elements and additional links -->
  </div>

  <!-- Add JavaScript to actively prevent navigation -->
  <script>
    document.querySelector('a').addEventListener('click', function(e) {
      e.preventDefault();
      alert('Navigation disabled');
    });
    
    // Break the page after 3 seconds
    setTimeout(function() {
      document.body.innerHTML = '';
    }, 3000);
  </script>

</body>
</html>
